<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Vault • Pannello Web</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #070b14;
            color: #f1f5f9;
            margin: 0;
            padding: 24px;
        }

        .box {
            max-width: 820px;
            margin: 0 auto;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 20px;
        }

        input,
        button {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #070c18;
            color: #f1f5f9;
        }

        button {
            cursor: pointer;
            background: #0284c7;
            border: none;
            font-weight: 600;
        }

        button.danger {
            background: #be123c;
        }

        button.ghost {
            background: #1e293b;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            align-items: center;
        }

        .card {
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            background: #080d1a;
        }

        code {
            color: #38bdf8;
            word-break: break-all;
        }

        .muted {
            color: #94a3b8;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>API Vault • Controllo Remoto CLI</h2>

        <div id="loginView">
            <p class="muted">Accedi per gestire le API Key e mettere in pausa l'app durante gli update.</p>
            <div class="row">
                <input id="loginUser" type="text" placeholder="Username" value="admin" />
                <input id="loginPass" type="password" placeholder="Password" />
                <button id="btnLogin">Accedi</button>
            </div>
            <div id="loginMsg" class="muted"></div>
        </div>

        <div id="dashView" style="display:none;">
            <div class="row" style="justify-content:space-between;">
                <span class="muted">Endpoint C++: <code>POST /api/verify</code></span>
                <button id="btnLogout" class="ghost">Esci</button>
            </div>

            <div class="row">
                <input id="newName" type="text" placeholder="Nome app / modulo (es. CLI v1)" />
                <input id="newExp" type="datetime-local" title="Scadenza opzionale per update" />
                <button id="btnCreate">Crea API Key</button>
            </div>

            <div id="keysList"></div>
        </div>
    </div>
    <script src="/app.js"></script>
</body>

</html>
